<!doctype html>
<html lang="en" data-phase="dusk">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  .scene { position: absolute; inset: 0; }
  .card {
    position: absolute; left: 50%; top: 46%; transform: translate(-50%, -50%);
    padding: 26px 46px 22px; text-align: center; color: #2a1d16;
    background: #f4ebdd; border: 8px solid #b3202a; border-radius: 26px;
    box-shadow: inset 0 0 0 3px #f4ebdd, inset 0 0 0 6px #7e1219, 0 30px 80px rgba(0,0,0,.5);
    font-family: system-ui, -apple-system, sans-serif;
  }
  .brand { font-size: 76px; font-weight: 800; letter-spacing: -0.03em; line-height: 1; }
  .brand span { color: #b3202a; }
  .deva { color: #b3202a; font-family: "Kohinoor Devanagari", "Noto Sans Devanagari", "Devanagari Sangam MN", sans-serif; font-weight: 700; letter-spacing: 0; }
  .en { font-size: 24px; letter-spacing: .1em; text-transform: uppercase; color: #6b5546; margin-top: 12px; }
</style>
</head>
<body>
  <div id="scene" class="scene"></div>
  <div class="card">
    <div class="brand"><span class="deva" lang="hi">जोहार</span><span>.fm</span></div>
    <div class="en">Nagpuri radio from Jharkhand</div>
  </div>
  <script type="module">
    import '/src/scene/scene.css';
    import { paletteCss } from '/src/scene/palettes.ts';
    import { akhraScene } from '/src/scene/akhra.ts';
    const s = document.createElement('style'); s.textContent = paletteCss(); document.head.append(s);
    document.getElementById('scene').innerHTML = akhraScene();
  </script>
</body>
</html>
