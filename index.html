<!doctype html>
<html lang="en-IN" class="app" data-phase="dusk" data-world="love">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>{{site.title}}</title>
    <meta name="description" content="{{site.description}}" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preload" href="/fonts/yatra-one-subset.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/mukta-latin-400.woff2" as="font" type="font/woff2" crossorigin />
    <meta name="theme-color" content="#b3202a" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!--HEAD-->
  </head>
  <body>
    <main>
      <section class="stage" aria-label="johar.fm">
        <div id="scene" class="scene" data-scene="love"><!--SCENE--></div>
        <div id="yt-wrap" class="yt-wrap" aria-hidden="true"><div id="yt"></div></div>

        <header class="top">
          <h1 class="brand"><span class="sr">johar.fm: Nagpuri songs radio from Jharkhand</span><span class="brand-deva" lang="hi" aria-hidden="true">जोहार</span><span aria-hidden="true">.fm</span></h1>
          <p class="greet" title="Jharkhand"><span class="sr">Jharkhand, </span>{{en.coords}}</p>
        </header>

        <div class="corner">
          <button class="theme-toggle" id="btn-theme" type="button" aria-label="{{en.themeNight}}" title="{{en.themeNight}}">
            <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>
            <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/></svg>
          </button>
          <p id="festival" class="festival" role="status" hidden></p>
        </div>

        <div class="dock" id="dock">
        <section class="radio" aria-label="Radio">
          <div class="dial" id="dial" role="group" aria-label="Choose a world">
            <div class="dial-scale" aria-hidden="true"></div>
            <div class="dial-needle" id="needle" aria-hidden="true"></div>
            <button class="station" data-world="love" aria-pressed="true"><span>{{en.world_love}}</span><small lang="hi">{{nag.world_love}}</small></button>
            <button class="station" data-world="travel" aria-pressed="false"><span>{{en.world_travel}}</span><small lang="hi">{{nag.world_travel}}</small></button>
            <button class="station" data-world="party" aria-pressed="false"><span>{{en.world_party}}</span><small lang="hi">{{nag.world_party}}</small></button>
            <button class="station" data-world="festive" aria-pressed="false"><span>{{en.world_festive}}</span><small lang="hi">{{nag.world_festive}}</small></button>
          </div>

          <div class="now" aria-live="polite">
            <p class="np-title" id="np-title"><span>{{en.tapToTune}}</span></p>
            <p class="np-artist" id="np-artist">&nbsp;</p>
          </div>

          <div class="controls">
            <button class="ctl ctl-play" id="btn-play" aria-label="{{en.play}}" title="{{en.play}} (Space)">
              <svg class="i-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
              <svg class="i-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>
            </button>
            <button class="ctl" id="btn-next" aria-label="{{en.next}}" title="{{en.next}} (→)">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l8.5 6L6 18zM16 6h2v12h-2z"/></svg>
            </button>
            <label class="vol" title="{{en.volume}} (↑ ↓)">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9zM16 8.5a4.5 4.5 0 0 1 0 7"/></svg>
              <span class="sr">{{en.volume}}</span>
              <input type="range" id="volume" min="0" max="100" step="1" value="70" />
            </label>
            <button class="ctl ctl-amb" id="btn-amb" aria-pressed="false" title="{{en.ambience}} (A)">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3c4 3 6 6 6 9a6 6 0 0 1-12 0c0-3 2-6 6-9zm0 5v12"/></svg>
              <span class="sr">{{en.ambience}}</span>
            </button>
            <a class="ctl ctl-yt" id="np-link" href="https://www.youtube.com/" target="_blank" rel="noopener" title="Open on YouTube" hidden>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9M18 14v5H5V6h5"/></svg>
              <span class="sr">Open this song on YouTube</span>
            </a>
          </div>
        </section>

          <p class="credit-line">
            {{en.madeWithLove}}
            · <a href="/credits/">Credits</a>
            · <a href="{{site.suggestUrl}}" target="_blank" rel="noopener">{{en.suggest}}</a>
          </p>
        </div>

        <div class="overlay" id="overlay">
          <button class="tune" id="tune">
            <span class="tune-greet" lang="hi">जोहार!</span>
            <span class="tune-en">{{en.tapToTune}}</span>
          </button>
        </div>
      </section>

    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
